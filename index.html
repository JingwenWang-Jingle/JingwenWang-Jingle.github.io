    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", "Source Han Sans SC", Arial, sans-serif;
            background-color: #f5f5f5;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(135deg, #DA1F28 0%, #800000 100%);
            color: white;
            padding: 14px 20px;
            text-align: center;
            display: block;
            flex-shrink: 0;
        }

        .header-title {
            font-size: 2.6rem;
            font-weight: bold;
            letter-spacing: 2px;
            line-height: 1.3;
        }

        .header-sub {
            font-size: 1.6rem;
            font-weight: bold;
            letter-spacing: 2px;
            line-height: 1.3;
            opacity: 0.9;
            margin-top: 6px;
        }

        .logo-section {
            text-align: center;
            padding: 40px 20px 30px;
            flex-shrink: 0;
        }

        .logo-section svg {
            max-width: 600px;
            width: 100%;
            height: auto;
            display: inline-block;
            pointer-events: none;
        }

        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 20px;
            flex: 1 0 auto;
            width: 100%;
        }

        .card-grid {
            display: flex;
            flex-direction: column;
            gap: 30px;
            width: 100%;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            text-align: left;
            cursor: pointer;
            text-decoration: none;
            display: block;
            border: none;
            width: 100%;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .card-title {
            font-size: 1.8rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 3px solid #DA1F28;
            display: inline-block;
        }

        .card-description {
            font-size: 1.05rem;
            color: #666;
            margin-top: 5px;
            font-weight: normal;
        }

        .color-preview {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .color-preview span {
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 6px;
            display: inline-block;
        }

        .footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 30px;
            flex-shrink: 0;
        }

        .footer-link {
            color: white;
            text-decoration: underline;
            cursor: pointer;
            transition: color 0.3s;
        }

        .footer-link:hover {
            color: #DA1F28;
        }

        @media (max-width: 768px) {
            html {
                font-size: 15px;
            }
            .header {
                padding: 12px 20px;
            }
            .logo-section {
                padding: 30px 20px 25px;
            }
            .logo-section svg {
                max-width: 400px;
            }
            .card {
                padding: 25px 20px;
            }
            .card-description {
                font-size: 1.05rem;
            }
            .footer {
                padding: 16px 20px;
            }
        }

        @media (max-width: 600px) {
            html {
                font-size: 14px;
            }
            .header {
                padding: 10px 16px;
            }
            .header-title {
                font-size: 2.2rem;
                letter-spacing: 1px;
            }
            .header-sub {
                font-size: 1.4rem;
                letter-spacing: 1px;
                margin-top: 4px;
            }
            .logo-section {
                padding: 22px 20px 18px;
            }
            .logo-section svg {
                max-width: 300px;
            }
            .main-content {
                padding: 0 10px 10px;
            }
            .card-grid {
                gap: 16px;
            }
            .card {
                padding: 16px 14px;
                border-radius: 10px;
            }
            .card-title {
                font-size: 1.6rem;
                padding-bottom: 6px;
                margin-bottom: 6px;
            }
            .card-description {
                font-size: 1rem;
                margin-top: 2px;
            }
            .color-preview {
                gap: 7px;
                margin-top: 10px;
            }
            .color-preview span {
                width: 2.2rem;
                height: 2.2rem;
                border-radius: 5px;
            }
            .footer {
                padding: 12px 16px;
            }
        }

        @media (max-width: 400px) {
            html {
                font-size: 13px;
            }
            .header {
                padding: 8px 12px;
            }
            .header-title {
                font-size: 1.8rem;
                letter-spacing: 0.5px;
            }
            .header-sub {
                font-size: 1.2rem;
                letter-spacing: 0.5px;
                margin-top: 3px;
            }
            .logo-section {
                padding: 16px 16px 14px;
            }
            .logo-section svg {
                max-width: 300px;
            }
            .card-grid {
                gap: 12px;
            }
            .card {
                padding: 14px 12px;
                border-radius: 8px;
            }
            .card-title {
                font-size: 1.4rem;
                padding-bottom: 4px;
                margin-bottom: 4px;
            }
            .card-description {
                font-size: 0.9rem;
            }
            .color-preview span {
                width: 1.8rem;
                height: 1.8rem;
                border-radius: 4px;
            }
            .color-preview {
                gap: 5px;
                margin-top: 8px;
            }
            .footer {
                padding: 10px 12px;
            }
        }
    </style>
</head>
